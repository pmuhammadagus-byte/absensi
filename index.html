<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GajiCalc — Kalkulator Gaji Sederhana</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #22d3ee;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container { width: 100%; max-width: 500px; }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    header { text-align: center; margin-bottom: 32px; }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(to right, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.05em;
    }

    .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    input {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      font-size: 1rem;
    }

    .table-container {
      margin-top: 24px;
      background: #0f172a;
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .scroll-area { max-height: 300px; overflow-y: auto; }

    table { width: 100%; border-collapse: collapse; }

    th {
      background: #1e293b;
      padding: 12px;
      text-align: left;
      font-size: 0.875rem;
      color: var(--text-muted);
      position: sticky;
      top: 0;
    }

    td { padding: 8px 12px; border-top: 1px solid var(--border); }

    input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }

    .summary-card {
      margin-top: 32px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
    }

    .stat-label { font-size: 0.875rem; font-weight: 600; color: rgba(255,255,255,0.8); text-transform: uppercase; }
    .stat-value { font-size: 2.5rem; font-weight: 800; color: white; display: block; margin-top: 8px; }
    .sub-stat { font-size: 1rem; color: rgba(255,255,255,0.7); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card">
      <header>
        <h1>GajiCalc</h1>
        <p style="color: var(--text-muted)">Hitung gaji bersih bulanan instan</p>
      </header>

      <div class="input-group">
        <label>Pilih Bulan</label>
        <input type="month" id="bulan" onchange="renderTable()">
      </div>
      <div class="input-group">
        <label>Tarif Harian (Rp)</label>
        <input type="number" id="tarif" value="200000" oninput="calculate()">
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th width="30%">Tanggal</th>
              <th>Hadir?</th>
            </tr>
          </thead>
        </table>
        <div class="scroll-area">
          <table>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="summary-card">
        <span class="stat-label">Total Gaji Bersih</span>
        <span class="stat-value" id="totalGaji">Rp 0</span>
        <div class="sub-stat" id="totalHadir">0 Hari Kerja</div>
      </div>
    </div>
  </div>

  <script>
    function renderTable() {
      const val = document.getElementById('bulan').value;
      if (!val) return;
      const [year, month] = val.split('-').map(Number);
      const days = new Date(year, month, 0).getDate();
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';

      for (let i = 1; i <= days; i++) {
        const date = new Date(year, month - 1, i);
        const isWeekend = date.getDay() === 0 || date.getDay() === 6;
        const tr = document.createElement('tr');
        
        tr.innerHTML = `
          <td width="30%">${i}</td>
          <td><input type="checkbox" class="hadir-check" ${isWeekend ? '' : 'checked'} onchange="calculate()"></td>
        `;
        tbody.appendChild(tr);
      }
      calculate();
    }

    function calculate() {
      const tarif = Number(document.getElementById('tarif').value) || 0;
      const checks = document.querySelectorAll('.hadir-check:checked');
      const totalHadir = checks.length;
      const totalGaji = totalHadir * tarif;

      document.getElementById('totalGaji').textContent = 'Rp ' + totalGaji.toLocaleString('id-ID');
      document.getElementById('totalHadir').textContent = totalHadir + ' Hari Kerja';
    }

    const now = new Date();
    document.getElementById('bulan').value = now.toISOString().slice(0, 7);
    renderTable();
  </script>
</body>
</html>
