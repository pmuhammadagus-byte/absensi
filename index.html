<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Gaji & Lembur</title>
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --primary: #2563eb; --text: #1e293b; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
    .card { background: var(--card); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border: 1px solid #f1f5f9; }
    h1 { font-size: 1.5rem; margin: 0 0 24px; text-align: center; color: #0f172a; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; color: #475569; }
    input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; transition: border-color 0.2s; }
    input:focus { border-color: var(--primary); outline: none; }
    .res { margin-top: 28px; padding-top: 24px; border-top: 2px dashed #e2e8f0; }
    .row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 1rem; color: #334155; }
    .total { font-weight: 800; font-size: 1.25rem; color: #1e293b; margin-top: 20px; padding: 12px; background: #eff6ff; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kalkulator Gaji</h1>
    <div class="field">
      <label>Tarif Harian (Rp)</label>
      <input type="number" id="tarif" value="200000" oninput="calc()">
    </div>
    <div class="field">
      <label>Jam Datang</label>
      <input type="time" id="masuk" value="08:00" oninput="calc()">
    </div>
    <div class="field">
      <label>Jam Pulang</label>
      <input type="time" id="pulang" value="18:00" oninput="calc()">
    </div>
    <div class="res" id="out"></div>
  </div>
  <script>
    function calc() {
      const tarif = Number(document.getElementById("tarif").value) || 0;
      const mVal = document.getElementById("masuk").value;
      const pVal = document.getElementById("pulang").value;
      if (!mVal || !pVal) return;
      const [h1, m1] = mVal.split(":").map(Number);
      const [h2, m2] = pVal.split(":").map(Number);
      
      let durasi = (h2 * 60 + m2) - (h1 * 60 + m1);
      if (durasi < 0) durasi += 24 * 60;
      
      const jamKerja = durasi / 60;
      const lembur = Math.max(0, jamKerja - 9);
      const upahLembur = lembur * (tarif / 9);
      const total = tarif + upahLembur;

      const fmt = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");
      document.getElementById("out").innerHTML = `
        <div class="row"><span>Total Jam Kerja</span><span>\${jamKerja.toFixed(2)} jam</span></div>
        <div class="row"><span>Lembur (di atas 9j)</span><span>\${lembur.toFixed(2)} jam</span></div>
        <div class="row"><span>Gaji Pokok</span><span>\${fmt(tarif)}</span></div>
        <div class="row"><span>Upah Lembur</span><span>\${fmt(upahLembur)}</span></div>
        <div class="row total"><span>Total Gaji Hari Ini</span><span>\${fmt(total)}</span></div>
      `;
    }
    calc();
  </script>
</body>
</html>
