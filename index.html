<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GajiCalc — Kalkulator Gaji Modern</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #22d3ee;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(to right, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.05em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 8px;
    }

    .grid-config {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group.full { grid-column: span 2; }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    input {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      font-size: 1rem;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }

    .table-container {
      margin-top: 32px;
      background: #0f172a;
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .scroll-area {
      max-height: 380px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    th {
      background: #1e293b;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: var(--text-muted);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
    }

    td input {
      padding: 6px;
      font-size: 0.813rem;
      width: 100%;
    }

    tr.weekend { background: rgba(244, 63, 94, 0.05); }
    tr.weekend td:first-child { color: #fb7185; font-weight: 600; }

    .summary-card {
      margin-top: 32px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border-radius: 24px;
      padding: 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 0.75rem; font-weight: 600; color: rgba(255,255,255,0.7); text-transform: uppercase; }
    .stat-value { font-size: 1.25rem; font-weight: 700; color: white; }

    .stat.total-pay {
      grid-column: span 2;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .stat.total-pay .stat-value { font-size: 2.5rem; letter-spacing: -0.02em; }

    .scroll-area::-webkit-scrollbar { width: 6px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    @media (max-width: 480px) {
      .grid-config { grid-template-columns: 1fr; }
      .input-group.full { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card">
      <header>
        <h1>GajiCalc</h1>
        <p class="subtitle">Kalkulator estimasi pendapatan bulanan modern</p>
      </header>

      <div class="grid-config">
        <div class="input-group full">
          <label>Pilih Periode</label>
          <input type="month" id="bulan" onchange="renderTable()">
        </div>
        <div class="input-group full">
          <label>Tarif Harian (Rp)</label>
          <input type="number" id="tarif" value="200000" oninput="calculate()">
        </div>
        <div class="input-group">
          <label>Default Masuk</label>
          <input type="time" id="defMasuk" value="08:00" oninput="applyDefault()">
        </div>
        <div class="input-group">
          <label>Default Pulang</label>
          <input type="time" id="defPulang" value="18:00" oninput="applyDefault()">
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th width="15%">Tgl</th>
              <th>Masuk</th>
              <th>Pulang</th>
              <th width="20%">Lembur</th>
            </tr>
          </thead>
        </table>
        <div class="scroll-area">
          <table id="tabelGaji">
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="summary-card" id="summary"></div>
    </div>
  </div>

  <script>
    function renderTable() {
      const val = document.getElementById('bulan').value;
      if (!val) return;
      const [year, month] = val.split('-').map(Number);
      const days = new Date(year, month, 0).getDate();
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';

      const defM = document.getElementById('defMasuk').value;
      const defP = document.getElementById('defPulang').value;

      for (let i = 1; i <= days; i++) {
        const date = new Date(year, month - 1, i);
        const dayNum = date.getDay();
        const isWeekend = dayNum === 0 || dayNum === 6;
        const tr = document.createElement('tr');
        if (isWeekend) tr.className = 'weekend';
        
        tr.innerHTML = `
          <td width="15%">${i}</td>
          <td><input type="time" class="in-m" value="${isWeekend ? '' : defM}" oninput="calculate()"></td>
          <td><input type="time" class="in-p" value="${isWeekend ? '' : defP}" oninput="calculate()"></td>
          <td width="20%" class="out-l" style="text-align:right">0</td>
        `;
        tbody.appendChild(tr);
      }
      calculate();
    }

    function applyDefault() {
      const defM = document.getElementById('defMasuk').value;
      const defP = document.getElementById('defPulang').value;
      document.querySelectorAll('#tbody tr:not(.weekend)').forEach(row => {
        row.querySelector('.in-m').value = defM;
        row.querySelector('.in-p').value = defP;
      });
      calculate();
    }

    function calculate() {
      const tarif = Number(document.getElementById('tarif').value) || 0;
      const rows = document.querySelectorAll('#tbody tr');
      let totalHadir = 0;
      let totalLembur = 0;

      rows.forEach(row => {
        const m = row.querySelector('.in-m').value;
        const p = row.querySelector('.in-p').value;
        const outL = row.querySelector('.out-l');

        if (m && p) {
          const [h1, mm1] = m.split(':').map(Number);
          const [h2, mm2] = p.split(':').map(Number);
          let durasi = (h2 * 60 + mm2) - (h1 * 60 + mm1);
          if (durasi < 0) durasi += 24 * 60;
          
          const jamKerja = durasi / 60;
          const lembur = Math.max(0, jamKerja - 9);
          outL.textContent = lembur.toFixed(1);
          totalLembur += lembur;
          totalHadir++;
        } else {
          outL.textContent = '0';
        }
      });

      const upahLembur = totalLembur * (tarif / 9);
      const gajiPokok = totalHadir * tarif;
      const totalGaji = gajiPokok + upahLembur;

      const fmt = (n) => 'Rp ' + Math.round(n).toLocaleString('id-ID');
      document.getElementById('summary').innerHTML = `
        <div class="stat">
          <span class="stat-label">Kehadiran</span>
          <span class="stat-value">${totalHadir} Hari</span>
        </div>
        <div class="stat">
          <span class="stat-label">Total Lembur</span>
          <span class="stat-value">${totalLembur.toFixed(1)} Jam</span>
        </div>
        <div class="stat">
          <span class="stat-label">Gaji Pokok</span>
          <span class="stat-value">${fmt(gajiPokok)}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Upah Lembur</span>
          <span class="stat-value">${fmt(upahLembur)}</span>
        </div>
        <div class="stat total-pay">
          <span class="stat-label">Estimasi Gaji Bersih</span>
          <span class="stat-value">${fmt(totalGaji)}</span>
        </div>
      `;
    }

    const now = new Date();
    document.getElementById('bulan').value = now.toISOString().slice(0, 7);
    renderTable();
  </script>
</body>
</html>
