<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalaryPro — Smart Work Tracker</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container { width: 100%; max-width: 500px; }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    header { text-align: center; margin-bottom: 32px; }

    h1 {
      font-size: 3rem;
      font-weight: 900;
      margin: 0;
      background: linear-gradient(135deg, #818cf8 0%, #22d3ee 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      font-style: italic;
    }

    .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    input {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      font-size: 1rem;
    }

    .table-container {
      margin-top: 24px;
      background: #0f172a;
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .scroll-area { max-height: 350px; overflow-y: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }

    th {
      background: #1e293b;
      padding: 12px;
      text-align: left;
      color: var(--text-muted);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td { padding: 6px 12px; border-top: 1px solid var(--border); }
    td input { width: 100%; background: transparent; border: none; color: white; padding: 4px 0; }
    
    tr.weekend { background: rgba(244, 63, 94, 0.05); }

    .summary-card {
      margin-top: 32px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border-radius: 24px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stat-row { display: flex; justify-content: space-between; align-items: baseline; }
    .stat-label { font-size: 0.75rem; font-weight: 600; color: rgba(255,255,255,0.75); text-transform: uppercase; }
    .stat-value { font-size: 1.25rem; font-weight: 700; color: white; }
    .stat-row.total { border-top: 1px solid rgba(255,255,255,0.2); padding-top: 16px; margin-top: 8px; }
    .stat-row.total .stat-value { font-size: 2rem; }

    .scroll-area::-webkit-scrollbar { width: 6px; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card">
      <header>
        <h1>SALARYPRO</h1>
        <p style="color: var(--text-muted)">Smart Work & Income Tracker</p>
      </header>

      <div class="input-group">
        <label>Pilih Periode</label>
        <input type="month" id="bulan" onchange="renderTable()">
      </div>
      <div class="input-group">
        <label>Tarif Harian (Rp / 9 Jam)</label>
        <input type="number" id="tarif" value="200000" oninput="calculate()">
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th width="15%">Tgl</th>
              <th>Datang</th>
              <th>Pulang</th>
              <th width="20%" style="text-align:right">Jam</th>
            </tr>
          </thead>
        </table>
        <div class="scroll-area">
          <table>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="summary-card">
        <div class="stat-row">
          <span class="stat-label">Total Jam Kerja</span>
          <span class="stat-value" id="totalJam">0j</span>
        </div>
        <div class="stat-row total">
          <span class="stat-label">Total Gaji Bersih</span>
          <span class="stat-value" id="totalGaji">Rp 0</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function renderTable() {
      const val = document.getElementById('bulan').value;
      if (!val) return;
      const [year, month] = val.split('-').map(Number);
      const days = new Date(year, month, 0).getDate();
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';

      for (let i = 1; i <= days; i++) {
        const date = new Date(year, month - 1, i);
        const isWeekend = date.getDay() === 0 || date.getDay() === 6;
        const tr = document.createElement('tr');
        if (isWeekend) tr.className = 'weekend';
        
        tr.innerHTML = `
          <td width="15%">${i}</td>
          <td><input type="time" class="in-m" oninput="calculate()"></td>
          <td><input type="time" class="in-p" oninput="calculate()"></td>
          <td width="20%" class="out-d" style="text-align:right; color: var(--text-muted)">0</td>
        `;
        tbody.appendChild(tr);
      }
      calculate();
    }

    function calculate() {
      const tarifHarian = Number(document.getElementById('tarif').value) || 0;
      const rows = document.querySelectorAll('#tbody tr');
      let totalMenit = 0;

      rows.forEach(row => {
        const m = row.querySelector('.in-m').value;
        const p = row.querySelector('.in-p').value;
        const outD = row.querySelector('.out-d');

        if (m && p) {
          const [h1, mm1] = m.split(':').map(Number);
          const [h2, mm2] = p.split(':').map(Number);
          let d = (h2 * 60 + mm2) - (h1 * 60 + mm1);
          if (d < 0) d += 24 * 60;
          
          totalMenit += d;
          outD.textContent = (d / 60).toFixed(1) + 'j';
          outD.style.color = 'var(--text-main)';
        } else {
          outD.textContent = '0';
          outD.style.color = 'var(--text-muted)';
        }
      });

      const totalJam = totalMenit / 60;
      const totalGaji = (totalJam / 9) * tarifHarian;

      document.getElementById('totalJam').textContent = totalJam.toFixed(1) + 'j';
      document.getElementById('totalGaji').textContent = 'Rp ' + Math.round(totalGaji).toLocaleString('id-ID');
    }

    const now = new Date();
    document.getElementById('bulan').value = now.toISOString().slice(0, 7);
    renderTable();
  </script>
</body>
</html>
